<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Intelligence Within</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --glitch-intensity: 0;
      --glitch-color-1: #ff0050;
      --glitch-color-2: #00ffeb;
      --parallax-x: 0px;
      --parallax-y: 0px;
      --parallax-bg-x: 0px;
      --parallax-bg-y: 0px;
      --parallax-rot-x: 0deg;
      --parallax-rot-y: 0deg;
      --parallax-scale: 1;
    }

    body {
      background-color: #000000;
      color: #10b981;
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
      margin: 0;
      cursor: none !important;
      perspective: 1200px;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    /* Force global cursor suppression on all elements */
    * {
      cursor: none !important;
    }

    input, textarea {
      user-select: text !important;
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
    }

    .crt-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      transform-style: preserve-3d;
    }

    .crt-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
      z-index: 999999;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      opacity: calc(0.4 + var(--glitch-intensity) * 0.6);
    }

    .scanline {
      width: 100%;
      height: 120px;
      z-index: 1000000;
      background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(16,185,129,0.08) 50%, rgba(0,0,0,0) 100%);
      opacity: 0.15;
      position: absolute;
      bottom: 100%;
      animation: scanline 6s linear infinite;
      pointer-events: none;
    }

    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(120vh); }
    }

    .glitch-text {
      position: relative;
      display: inline-block;
    }

    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: calc(var(--glitch-intensity) * 0.8);
      pointer-events: none;
    }

    .glitch-text::before {
      left: calc(var(--glitch-intensity) * 2px);
      text-shadow: -1px 0 var(--glitch-color-1);
      background: transparent;
      clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
      animation: glitch-anim-1 2s infinite linear alternate-reverse;
    }

    .glitch-text::after {
      left: calc(var(--glitch-intensity) * -2px);
      text-shadow: -1px 0 var(--glitch-color-2);
      background: transparent;
      clip-path: polygon(0 80%, 100% 20%, 100% 100%, 0 100%);
      animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim-1 {
      0% { clip-path: inset(20% 0 30% 0); transform: translate(-2px, 2px); }
      20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -2px); }
      40% { clip-path: inset(40% 0 50% 0); transform: translate(-3px, 0); }
      60% { clip-path: inset(80% 0 5% 0); transform: translate(3px, 2px); }
      80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, -1px); }
      100% { clip-path: inset(30% 0 20% 0); transform: translate(1px, 1px); }
    }

    @keyframes glitch-anim-2 {
      0% { clip-path: inset(15% 0 35% 0); transform: translate(2px, -2px); }
      20% { clip-path: inset(55% 0 15% 0); transform: translate(-2px, 2px); }
      40% { clip-path: inset(35% 0 45% 0); transform: translate(3px, 0); }
      60% { clip-path: inset(75% 0 10% 0); transform: translate(-3px, -2px); }
      80% { clip-path: inset(5% 0 75% 0); transform: translate(1px, 1px); }
      100% { clip-path: inset(25% 0 25% 0); transform: translate(-1px, -1px); }
    }

    @keyframes digital-flicker-in {
      0% { opacity: 0; transform: scaleY(0.005) scaleX(1.5); filter: brightness(10) contrast(20); }
      5% { opacity: 0.8; transform: scaleY(1.1) scaleX(0.9); }
      10% { opacity: 0.2; transform: scaleY(0.9) scaleX(1.1); }
      15% { opacity: 1; transform: scaleY(1) scaleX(1); filter: brightness(2) contrast(1); }
      20% { opacity: 0.4; filter: brightness(5); }
      25% { opacity: 1; filter: brightness(1); }
      30% { opacity: 0.1; }
      35% { opacity: 1; }
      100% { opacity: 1; transform: scale(1); filter: brightness(1); }
    }

    /* New Memory Appearance Animations */
    @keyframes ghost-appear {
      0% { opacity: 0; filter: blur(20px) brightness(2) saturate(0); transform: scale(1.8) rotate(-10deg); }
      100% { opacity: 1; filter: blur(0px) brightness(1) saturate(1); transform: scale(1) rotate(0deg); }
    }

    @keyframes blip-appear {
      0% { opacity: 0; transform: scale(0) rotate(180deg); filter: brightness(20); }
      60% { opacity: 1; transform: scale(1.4) rotate(-15deg); filter: brightness(2); }
      80% { transform: scale(0.9) rotate(5deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); filter: brightness(1); }
    }

    @keyframes steady-materialize {
      0% { clip-path: inset(0 100% 0 0); opacity: 0; }
      100% { clip-path: inset(0 0 0 0); opacity: 1; }
    }

    /* Unique Memory Disappearance Animations */
    @keyframes disintegrate {
      0% { opacity: 1; filter: blur(0px) contrast(1); transform: scale(1); }
      30% { opacity: 0.8; filter: blur(2px) contrast(2) hue-rotate(90deg); transform: scale(1.1); }
      100% { opacity: 0; filter: blur(15px) contrast(0) hue-rotate(180deg); transform: scale(0.4) translateY(-20px); }
    }

    @keyframes ghost-vanish {
      0% { opacity: 1; filter: blur(0px) brightness(1); transform: scale(1); }
      100% { opacity: 0; filter: blur(30px) brightness(2); transform: scale(2); }
    }

    @keyframes flee-exit {
      0% { opacity: 1; transform: scale(1) translate(0, 0); filter: saturate(1) contrast(1); }
      100% { opacity: 0; transform: scale(0) translate(0, -40px); filter: saturate(4) contrast(3); }
    }

    @keyframes sudden-pop {
      0% { opacity: 1; transform: scale(1); filter: brightness(1); }
      10% { opacity: 1; transform: scale(1.4); filter: brightness(20); }
      100% { opacity: 0; transform: scale(0); filter: brightness(1); }
    }

    @keyframes glitch-evaporate {
      0% { opacity: 1; transform: translateX(0); }
      20% { opacity: 0.8; transform: translateX(-10px) skewX(20deg); }
      40% { opacity: 0.9; transform: translateX(15px) skewX(-20deg); }
      60% { opacity: 0.4; transform: translateX(-20px) scaleY(0.1); }
      80% { opacity: 0.6; transform: translateX(25px) scaleY(2); }
      100% { opacity: 0; transform: translateX(0) scale(0); }
    }

    .animate-digital-entry { animation: digital-flicker-in 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
    .animate-ghost-appear { animation: ghost-appear 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
    .animate-blip-appear { animation: blip-appear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .animate-materialize { animation: steady-materialize 1s ease-out forwards; }
    
    .animate-disintegrate { animation: disintegrate 0.6s ease-in forwards; }
    .animate-evaporate { animation: glitch-evaporate 0.4s steps(4) forwards; }
    .animate-ghost-exit { animation: ghost-vanish 1s cubic-bezier(0.4, 0, 1, 1) forwards; }
    .animate-flee-exit { animation: flee-exit 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    .animate-sudden-exit { animation: sudden-pop 0.3s cubic-bezier(0.4, 0, 1, 1) forwards; }

    .shake {
      animation: screen-shake 0.1s infinite;
    }

    @keyframes screen-shake {
      0% { transform: translate(0, 0); }
      25% { transform: translate(calc(var(--glitch-intensity) * -2px), calc(var(--glitch-intensity) * 2px)); }
      50% { transform: translate(calc(var(--glitch-intensity) * 2px), calc(var(--glitch-intensity) * -1px)); }
      75% { transform: translate(calc(var(--glitch-intensity) * -1px), calc(var(--glitch-intensity) * -2px)); }
    }

    .flicker {
      animation: flicker 0.1s infinite;
    }
    @keyframes flicker {
      0% { opacity: 0.98; }
      50% { opacity: 1; }
      100% { opacity: 0.99; }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #050506; }
    ::-webkit-scrollbar-thumb { background: #064e3b; }
    ::-webkit-scrollbar-thumb:hover { background: #10b981; }

    .reticle {
      position: fixed;
      pointer-events: none !important;
      z-index: 99999999;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      mix-blend-mode: screen;
      transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s ease-out, width 0.2s ease-in-out, height 0.2s ease-in-out;
    }
    
    /* Focused Distorted Point Style */
    .reticle.point-mode {
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 20px #fff, 0 0 40px #10b981;
      filter: contrast(200%) brightness(150%);
      animation: point-jitter 0.1s infinite;
    }

    .reticle.point-mode.terminal-hover {
       width: 20px;
       height: 20px;
       background: #10b981;
       box-shadow: 0 0 30px #10b981, 0 0 60px rgba(16, 185, 129, 0.5);
       border: 2px solid white;
    }
    
    .reticle.point-mode .reticle-bracket {
      opacity: 0;
      transform: scale(0.2);
    }

    @keyframes point-jitter {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-51%, -49%) scale(1.1); opacity: 0.9; }
    }

    .reticle-bracket {
      position: absolute;
      width: 10px;
      height: 10px;
      border: 1px solid #10b981;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0.6;
    }
    .reticle-bracket-tl { top: 0; left: 0; border-right: 0; border-bottom: 0; }
    .reticle-bracket-tr { top: 0; right: 0; border-left: 0; border-bottom: 0; }
    .reticle-bracket-bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
    .reticle-bracket-br { bottom: 0; right: 0; border-left: 0; border-top: 0; }
    
    .reticle.ghost {
      filter: blur(3px);
      animation: ghost-pulse 4s infinite ease-in-out;
    }
    @keyframes ghost-pulse {
      0%, 100% { opacity: 0.1; transform: translate(-50%, -50%) scale(0.85); }
      50% { opacity: 0.4; transform: translate(-50%, -50%) scale(1.2); }
    }

    .reticle.active .reticle-bracket {
      border-width: 2px;
      opacity: 1;
      border-color: #34d399;
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.6);
    }

    .reticle.focusing {
      transform: translate(-50%, -50%) scale(0.65);
      filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.8));
    }
    .reticle.focusing .reticle-bracket {
      border-color: #ffffff;
      width: 18px;
      height: 18px;
      border-width: 3px;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
    }

    .reticle.active::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: #34d399;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px #34d399;
      transition: transform 0.2s ease;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 2px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.2);
    }

    @keyframes scan {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3"
  }
}
</script>
</head>
<body class="flicker">
  <div id="root" class="crt-screen"></div>
  <div class="scanline"></div>
</body>
</html>
